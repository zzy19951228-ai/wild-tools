<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>岗位个人权重打分器 AI 版｜打工人决策台</title>
<style>

:root{--ink:#C7D3E8;--orange:#4D6BFE;--cream:#1A2740;--muted:#8A94A8;--yellow:#5AC8FA;--ok:#34C98E}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(160deg,#0B1220 0%,#101B30 55%,#0B1220 100%);color:#E7EDF7}
main{max-width:980px;margin:0 auto;padding:30px 18px 60px}
.tag{display:inline-block;padding:6px 12px;border-radius:99px;background:#1A2740;color:#5AC8FA;font-weight:800;font-size:13px;letter-spacing:1px;border:1px solid #31435F}
h1{font-size:clamp(25px,5vw,40px);letter-spacing:-1px;margin:12px 0 8px;color:#E7EDF7}
.lead{color:var(--muted);font-size:15px;line-height:1.75;max-width:720px}
.lead b{color:#5AC8FA}
.privacy{margin:14px 0 22px;padding:12px 15px;border:1px solid #31435F;border-radius:12px;font-size:13px;line-height:1.7;background:rgba(26,39,64,.55);max-width:720px;color:#B7C2D8}
h2.sec{font-size:19px;margin:26px 0 4px;display:flex;align-items:center;gap:8px;color:#E7EDF7}
h2.sec::before{content:"▸";color:var(--orange)}
.sec-sub{color:var(--muted);font-size:13px;margin:0 0 10px}
#cfgBtn{position:fixed;top:14px;right:14px;z-index:50;border:1px solid #31435F;background:#141F33;border-radius:99px;padding:9px 18px;font-weight:900;font-size:14px;cursor:pointer;color:#E7EDF7;box-shadow:0 4px 16px rgba(0,0,0,.45)}
#cfgBtn.has{background:#34C98E;color:#0B1220;border-color:#34C98E}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid #31435F;border-radius:10px;padding:10px 13px;font-size:14px;margin:4px 0 10px;font-family:inherit;background:#101B30;color:#E7EDF7}
textarea:focus,input:focus{outline:2px solid #2E4270;border-color:#4D6BFE}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.ai-box{background:#141F33;border:1px solid #31435F;border-radius:15px;padding:16px}
.big{display:block;width:100%;padding:14px;font-size:16.5px;font-weight:900;border:none;border-radius:13px;cursor:pointer;background:linear-gradient(135deg,#4D6BFE,#3D5AE8);color:#fff;box-shadow:0 6px 18px rgba(77,107,254,.35);margin-top:8px}
.big:active{transform:translateY(1px)}
.big.ghost{background:#1A2740;color:#C7D3E8;font-size:14px;padding:11px;box-shadow:none;border:1px solid #31435F}
.status{font-size:13px;margin-top:8px;color:var(--muted)}
.status.ok{color:var(--ok);font-weight:700}
.status.err{color:#FF7A7A;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{padding:7px 15px;border:1px solid #31435F;border-radius:99px;background:#141F33;font-weight:800;font-size:13.5px;cursor:pointer;color:#C7D3E8}
.chip.on{background:#4D6BFE;color:#fff;border-color:#4D6BFE}
.wrow{display:flex;align-items:center;gap:12px;background:#141F33;border:1px solid #31435F;border-radius:12px;padding:9px 13px;margin:7px 0}
.wrow .nm{font-weight:800;font-size:14.5px;width:105px;flex:none}
.wrow input[type=range]{flex:1;accent-color:#4D6BFE}
.wrow .wv{width:62px;text-align:center;font-weight:900;color:#5AC8FA;font-size:13.5px}
.card{background:#141F33;border:1px solid #31435F;border-radius:13px;padding:14px 16px;margin:9px 0}
.srow{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.srow .snm{font-size:13px;font-weight:700;width:105px}
.pb{width:33px;height:33px;border:1px solid #31435F;border-radius:8px;background:#101B30;font-weight:900;cursor:pointer;font-size:13.5px;color:#C7D3E8}
.pb.on{background:#4D6BFE;color:#fff;border-color:#4D6BFE}
.job{background:#141F33;border:1px solid #31435F;border-radius:13px;padding:12px 15px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.job .jn{font-weight:900;font-size:15.5px;color:#E7EDF7}
.job .jc{color:var(--muted);font-size:12.5px;margin-top:3px}
.job .sc{font-weight:900;font-size:19px;color:#5AC8FA;white-space:nowrap}
.job .del{border:none;background:none;color:#FF7A7A;cursor:pointer;font-size:12px;font-weight:800;padding:4px}
.rank{border:1px solid #31435F;border-radius:16px;background:#141F33;overflow:hidden;margin-top:14px}
.rank-head{padding:13px 17px;background:#101B30;color:#E7EDF7;border-bottom:1px solid #243654}
.rank-head .win{font-size:21px;font-weight:900;color:#5AC8FA}
.rrow{padding:11px 17px;border-top:1px solid #243654}
.rrow .rt{display:flex;justify-content:space-between;font-weight:800;font-size:14.5px;margin-bottom:6px;color:#E7EDF7}
.bar{height:13px;border-radius:99px;background:#223252;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4D6BFE,#5AC8FA)}
.rrow .why{color:var(--muted);font-size:12px;margin-top:5px}
.ov{background:#141F33;border:1px solid #31435F;border-radius:15px;padding:15px;margin-top:12px}
.ov .city{margin:10px 0}
.ov .cl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;margin-bottom:4px;color:#E7EDF7}
.range{position:relative;height:15px;border-radius:99px;background:#223252}
.range i{position:absolute;top:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#4D6BFE,#5AC8FA)}
.range .mid{position:absolute;top:-3px;width:3px;height:21px;background:#E7EDF7;border-radius:2px}
.refbar{position:relative;height:15px;margin-top:6px}
.refbar i{position:absolute;top:0;height:100%;border:2px dashed #34C98E;border-radius:99px;background:rgba(52,201,142,.12)}
.dlg{position:fixed;inset:0;background:rgba(5,9,18,.7);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.dlg.on{display:flex}
.dlg .box{background:#141F33;border:1px solid #31435F;border-radius:17px;max-width:560px;width:100%;padding:22px;margin:20px 0;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg h3{margin:0 0 6px;font-size:20px;color:#E7EDF7}
.dlg .x{float:right;border:1px solid #31435F;background:#101B30;color:#C7D3E8;border-radius:9px;width:34px;height:34px;font-weight:900;cursor:pointer}
label.lb{font-weight:800;font-size:13.5px;display:block;margin-top:10px;color:#C7D3E8}
.guide{background:#101B30;border:1px dashed #31435F;border-radius:11px;padding:11px 14px;font-size:12.5px;line-height:1.75;margin-top:12px;color:#B7C2D8}
footer{margin-top:30px;padding-top:16px;border-top:1px solid #243654;color:var(--muted);font-size:13px;line-height:1.8}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.pv{border:1px solid #4D6BFE;border-radius:15px;background:#141F33;padding:16px;margin-top:12px}
.pv .ph{font-weight:900;font-size:17px;color:#E7EDF7}
.pv .pm{color:var(--muted);font-size:13px;margin:4px 0 8px}
.pv .fl{font-size:12.5px;color:#FF7A7A;margin:6px 0}
</style>
</head>
<body>
<button id="cfgBtn">⚙️ 模型设置</button>
<main>
<span class="tag">求职决策工具 · AI 版</span>
<h1>岗位个人权重打分器</h1>
<p class="lead">没有"最好的岗位"，只有<b>对你的权衡最划算的岗位</b>。配一次你自己的 AI 模型（<b>设置在右上角</b>），以后只要<b>把 JD 粘贴进来</b>——AI 自动解析薪资、城市、硬性要求和红旗话术，按你的权重打好建议分，你确认或微调就行。</p>
