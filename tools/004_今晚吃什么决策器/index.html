<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>今晚吃什么决策器｜工具 #004</title>
<style>
:root{--ink:#C7D3E8;--orange:#4D6BFE;--cream:#FFF6EC;--yellow:#5AC8FA;--muted:#8A94A8;--line:#31435F}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(135deg,#fff6ec,#fff 60%,#1A2740)}main{max-width:1060px;margin:auto;padding:31px 20px 52px}header{display:flex;justify-content:space-between;gap:18px;align-items:start;margin-bottom:25px}.tag{display:inline-block;background:var(--orange);border-radius:999px;padding:7px 12px;color:#fff;font-size:13px;font-weight:800}h1{font-size:clamp(30px,6vw,51px);letter-spacing:-2px;margin:9px 0}.lead{margin:0;color:var(--muted);line-height:1.7}.privacy{background:#141F33;border:2px solid var(--ink);border-radius:14px;padding:12px;max-width:256px;font-size:13px;line-height:1.55}.privacy b{color:var(--orange)}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:19px}.card{background:rgba(255,255,255,.88);border:2px solid var(--ink);border-radius:20px;padding:22px;box-shadow:7px 7px 0 var(--ink)}h2{margin:0 0 6px;font-size:21px}.hint{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.6}label{display:block;margin:14px 0 7px;font-weight:800;font-size:15px}input,textarea{width:100%;padding:11px 12px;font:inherit;border:1.5px solid var(--line);border-radius:11px;background:#141F33;color:var(--ink)}textarea{min-height:162px;resize:vertical;line-height:1.6}input:focus,textarea:focus{outline:3px solid #16223A;border-color:var(--orange)}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.buttonrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}button{border:2px solid var(--ink);border-radius:12px;padding:11px 15px;background:var(--yellow);box-shadow:3px 3px 0 var(--ink);font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#141F33}button:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}.result{margin-top:18px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:18px;padding:22px;background:#C7D3E8;color:#fff}.result .small{color:#5AC8FA;font-size:14px;font-weight:800}.result h3{font-size:clamp(31px,6vw,47px);margin:10px 0;letter-spacing:-1px}.result p{margin:0;color:#31435F;line-height:1.7}.pills{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:15px}.pill{background:#141F336ec;color:#C7D3E8;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}footer{margin-top:25px;color:var(--muted);font-size:13px;line-height:1.7}@media(max-width:760px){main{padding:20px 15px 42px}header{display:block}.privacy{margin-top:14px}.grid{grid-template-columns:1fr}.card{padding:17px;box-shadow:5px 5px 0 var(--ink)}}
</style></head>
<body><main><header><div><span class="tag">野生工具匠 · 工具 #004</span><h1>今晚吃什么决策器</h1><p class="lead">不是瞎转盘。先把预算、距离和不想吃的筛掉，再把决定交给一点随机。</p></div><div class="privacy"><b>纯本地运行</b><br>不联网、不上传内容；关掉页面后不会保存。</div></header>
<section class="grid"><div class="card"><h2>把备选店填进来</h2><p class="hint">每行格式：<b>店名｜人均价格｜距离（km）｜标签</b>。例如：老街面馆｜28｜0.6｜面食,不辣</p><label for="options">备选吃什么？</label><textarea id="options" placeholder="老街面馆｜28｜0.6｜面食,不辣&#10;川味小馆｜55｜1.2｜川菜,辣&#10;牛肉饭｜35｜0.3｜快餐,不辣"></textarea><div class="row"><div><label for="budget">人均预算（元）</label><input id="budget" type="number" min="0" placeholder="例如：50"/></div><div><label for="distance">最多走多远（km）</label><input id="distance" type="number" min="0" step="0.1" placeholder="例如：1"/></div></div><label for="avoid">今天不想吃什么？（逗号分隔，可空）</label><input id="avoid" placeholder="例如：辣,面食"/><div class="buttonrow"><button id="choose">帮我筛完再选</button><button class="secondary" id="fill">填入示例</button><button class="secondary" id="clear">清空</button></div></div>
<div class="card"><h2>今晚的答案</h2><p class="hint">它只根据你提供的备选条件做决策辅助；店铺营业、价格、过敏原等请自行确认。</p><div class="result" id="result"><div class="small">先填左侧条件</div><h3>今晚吃什么？</h3><p>筛掉不合适的选项，再从剩下的里面挑一个。</p></div></div></section><footer>工具 #004 的边界：这是帮你减少选择困难的本地小工具，不提供餐饮、营养、过敏或食品安全建议。</footer></main>
<script>
const $=id=>document.getElementById(id);const parse=line=>{const p=line.split(/[｜|]/).map(x=>x.trim());return{name:p[0]||'未命名',price:Number(p[1]),distance:Number(p[2]),tags:(p[3]||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean)}};function choose(){const list=$('options').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(parse);const budget=Number($('budget').value),dist=Number($('distance').value),avoid=$('avoid').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);let valid=list.filter(x=>(!Number.isFinite(budget)||budget<=0||x.price<=budget)&&(!Number.isFinite(dist)||dist<=0||x.distance<=dist)&&!avoid.some(a=>x.tags.includes(a)||x.name.includes(a)));const box=$('result');if(!valid.length){box.innerHTML='<div class="small">没有合适的备选</div><h3>放宽一个条件？</h3><p>试试提高预算、走远一点，或删掉一项“不想吃”。</p>';return}const win=valid[Math.floor(Math.random()*valid.length)];box.innerHTML=`<div class="small">从 ${valid.length} 个符合条件的选项里选出</div><h3>就吃：${win.name}</h3><p>人均约 ${win.price||'待确认'} 元 · 距离约 ${win.distance||'待确认'} km</p><div class="pills">${win.tags.map(t=>`<span class="pill">${t}</span>`).join('')||'<span class="pill">已通过你的筛选</span>'}</div>`}$('choose').onclick=choose;$('fill').onclick=()=>{$('options').value='老街面馆｜28｜0.6｜面食,不辣\n川味小馆｜55｜1.2｜川菜,辣\n牛肉饭｜35｜0.3｜快餐,不辣\n日式简餐｜48｜0.8｜日料,不辣';$('budget').value='50';$('distance').value='1';$('avoid').value='辣';choose()};$('clear').onclick=()=>{['options','budget','distance','avoid'].forEach(id=>$(id).value='');$('result').innerHTML='<div class="small">先填左侧条件</div><h3>今晚吃什么？</h3><p>筛掉不合适的选项，再从剩下的里面挑一个。</p>'};
</script></body></html>
