<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>会议行动项整理器｜工具 #003</title>
<style>
:root{--ink:#C7D3E8;--orange:#4D6BFE;--cream:#FFF6EC;--yellow:#5AC8FA;--muted:#8A94A8;--line:#31435F}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(140deg,#fff6ec,#fff 60%,#1A2740)}main{max-width:1080px;margin:auto;padding:31px 20px 52px}header{display:flex;justify-content:space-between;gap:18px;align-items:start;margin-bottom:25px}.tag{display:inline-block;background:var(--orange);border-radius:999px;padding:7px 12px;color:#fff;font-size:13px;font-weight:800}h1{font-size:clamp(30px,6vw,51px);letter-spacing:-2px;margin:9px 0}.lead{margin:0;color:var(--muted);line-height:1.7}.privacy{background:#141F33;border:2px solid var(--ink);border-radius:14px;padding:12px;max-width:256px;font-size:13px;line-height:1.55}.privacy b{color:var(--orange)}.card{background:rgba(255,255,255,.88);border:2px solid var(--ink);border-radius:20px;padding:22px;box-shadow:7px 7px 0 var(--ink)}h2{margin:0 0 6px;font-size:21px}.hint{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:19px}label{display:block;margin:14px 0 7px;font-weight:800;font-size:15px}input,textarea{width:100%;padding:11px 12px;font:inherit;border:1.5px solid var(--line);border-radius:11px;background:#141F33;color:var(--ink)}textarea{min-height:185px;resize:vertical;line-height:1.6}input:focus,textarea:focus{outline:3px solid #16223A;border-color:var(--orange)}.buttonrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}button{border:2px solid var(--ink);border-radius:12px;padding:11px 15px;background:var(--yellow);box-shadow:3px 3px 0 var(--ink);font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#141F33}button:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:10px 7px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}td[contenteditable]{background:#141F33be9;border-radius:5px}#summary{white-space:pre-wrap;line-height:1.65;min-height:100px;margin:14px 0 0;padding:12px;border:1.5px dashed var(--line);border-radius:11px;color:#1B2A45}footer{margin-top:25px;color:var(--muted);font-size:13px;line-height:1.7}@media(max-width:760px){main{padding:20px 15px 42px}header{display:block}.privacy{margin-top:14px}.grid{grid-template-columns:1fr}.card{padding:17px;box-shadow:5px 5px 0 var(--ink)}}
</style></head>
<body><main><header><div><span class="tag">野生工具匠 · 工具 #003</span><h1>会议行动项整理器</h1><p class="lead">会议结束后，留下“谁在什么时候做什么”，而不是一篇没人会再看的流水账。</p></div><div class="privacy"><b>纯本地运行</b><br>不联网、不上传内容；关掉页面后不会保存。</div></header>
<section class="grid"><div class="card"><h2>一行一件事</h2><p class="hint">推荐格式：<b>负责人｜要做什么｜截止时间</b>。粘贴会议记录也可以，但请逐项人工确认。</p><label for="topic">会议主题</label><input id="topic" placeholder="例如：8 月活动上线准备会"/><label for="raw">行动项</label><textarea id="raw" placeholder="小李｜确认最终文案｜8 月 21 日 17:00 前&#10;小王｜提交首版海报｜8 月 22 日&#10;我｜发出达人邀约｜8 月 23 日"></textarea><div class="buttonrow"><button id="generate">整理行动项</button><button class="secondary" id="fill">填入示例</button><button class="secondary" id="clear">清空</button></div></div>
<div class="card"><h2>待确认行动项</h2><p class="hint">这里是可编辑草稿。点击表格单元格就能修正；生成后再复制发送。</p><div id="tablewrap"><p class="hint">填左侧内容后，点击“整理行动项”。</p></div><div class="buttonrow"><button class="secondary" id="copy">复制行动项</button></div><div id="summary">请先生成行动项。</div></div></section><footer>工具 #003 的边界：它不会判断会议结论是否正确。负责人、动作和截止时间必须由参会者确认后再发出。</footer></main>
<script>
const $=id=>document.getElementById(id);let items=[];const clean=x=>x.trim();function parse(line){let p=line.split(/[｜|]/).map(clean);if(p.length<3)p=line.split(/[，,；;]/).map(clean);return {owner:p[0]||'待确认',task:p[1]||line.trim(),due:p.slice(2).join('｜')||'待确认'}}function render(){const wrap=$('tablewrap');if(!items.length){wrap.innerHTML='<p class="hint">没有识别到行动项。请每行填写一件事。</p>';return}let html='<table><thead><tr><th>负责人</th><th>行动项</th><th>截止时间</th></tr></thead><tbody>';items.forEach((x,i)=>html+=`<tr><td contenteditable data-i="${i}" data-k="owner">${x.owner}</td><td contenteditable data-i="${i}" data-k="task">${x.task}</td><td contenteditable data-i="${i}" data-k="due">${x.due}</td></tr>`);html+='</tbody></table>';wrap.innerHTML=html;wrap.querySelectorAll('[contenteditable]').forEach(el=>el.oninput=()=>{items[el.dataset.i][el.dataset.k]=el.textContent.trim();summary()});summary()}function summary(){const topic=$('topic').value.trim()||'本次会议';const text=`【${topic}｜行动项】\n`+items.map((x,i)=>`${i+1}. ${x.owner}：${x.task}（截止：${x.due}）`).join('\n')+'\n\n请各负责人确认；如有时间调整请及时同步。';$('summary').textContent=text}function generate(){items=$('raw').value.split(/\n+/).map(clean).filter(Boolean).map(parse);render()}$('generate').onclick=generate;$('fill').onclick=()=>{$('topic').value='8 月活动上线准备会';$('raw').value='小李｜确认最终文案｜8 月 21 日 17:00 前\n小王｜提交首版海报｜8 月 22 日\n我｜发出达人邀约｜8 月 23 日';generate()};$('clear').onclick=()=>{$('topic').value='';$('raw').value='';items=[];$('tablewrap').innerHTML='<p class="hint">填左侧内容后，点击“整理行动项”。</p>';$('summary').textContent='请先生成行动项。'};$('copy').onclick=async()=>{let text=$('summary').textContent;try{await navigator.clipboard.writeText(text);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制行动项',1300)}catch{window.prompt('复制以下内容：',text)}};
</script></body></html>
